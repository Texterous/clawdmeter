; Clawdmeter — PlatformIO project.
;
; One board: the GeekMagic SmallTV-Ultra, ESP-12F (ESP8266), 4 MB flash,
; 1.54" 240x240 ST7789 IPS. Three build targets, and the split matters:
;
;   env:ultra       full image. HTTPS + GitHub self-update, so recipients get
;                   fixes without touching a laptop. Installed over the slim
;                   image via our own /update, which is not subject to stock's
;                   OTA slot size.
;
;   env:ultra_slim  -D NO_TLS. No BearSSL, no HTTPS, no self-update — usage is
;                   PUSHED to the device, so nothing outbound needs TLS. This is
;                   the image that has to squeeze through the STOCK Ultra OTA
;                   slot on a factory-fresh unit, and it is already fully
;                   functional: a unit can be handed out having only seen this.
;
;   env:ultra_giveaway
;                   ultra_slim with -D NO_PROVISION. The image for units you
;                   hand out: no baked credential, so every unit comes up in
;                   setup-AP mode and joins its own recipient's network.
;
;   env:loader      fallback for the two-step install, only needed if the slim
;                   image still exceeds stock's slot. Bake WiFi in with
;                   -DLOADER_SSID/-DLOADER_PASS so it joins the event network
;                   instead of opening an AP (which would cost a second AP join
;                   per unit — see provision/README.md).
;
; Build:            pio run -e ultra_slim
; Artifact:         .pio/build/<env>/firmware.bin
; Flash over WiFi:  upload firmware.bin in the web UI's System tab, or
;                   curl -F "firmware=@firmware.bin" http://<host>/update
;
; There is no USB path: the Ultra's USB-C is power only, with no serial chip.
;
; Derived from giovi321/smalltv-mod (WTFPL).

[platformio]
default_envs = ultra_slim
src_dir = src

; ---------------------------------------------------------------------------
[common]
; Pinned, not floating. The slim image has a few hundred bytes of room under CI's
; 520,000 B gate, and CI does `pip install --upgrade platformio` against a cache
; keyed on this file — so an unpinned platform or a caret range lets a minor
; toolchain bump move the image by more than the whole margin and fail main on a
; tree that is green on every developer machine. Bump these deliberately, and
; re-measure the slim image in the same commit.
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino

; ESP-12F on the Ultra carries 4 MB flash. Layout: 1 MB LittleFS, the rest for
; sketch + OTA (OTA needs room for two sketch copies).
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

monitor_speed = 115200

; Regenerate the PROGMEM blobs (web UI, agent installers, splash) before every
; build, so a stale webui.h can never ship. Deterministic: unchanged sources
; leave the generated headers byte-identical.
extra_scripts = pre:tools/pre_build.py

; Low-memory lwIP leaves more heap for the framebuffer-less display rendering.
; Bandwidth is irrelevant for the tiny JSON payloads involved.
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0

; Feature folder on the include path so cross-module quote-includes resolve.
; MUST be build_src_flags (project sources only), not build_flags — a global
; -Isrc leaks into the framework build and shadows internal headers.
build_src_flags =
	-iquote src
	-iquote src/meter

; Exact versions, for the same reason as the platform pin above.
lib_deps =
	bblanchon/ArduinoJson @ 7.4.3
	moononournation/GFX Library for Arduino @ 1.6.7

; ---------------------------------------------------------------------------
; Full image: HTTPS + GitHub self-update.
; ---------------------------------------------------------------------------
[env:ultra]
extends = common
build_flags =
	${common.build_flags}

; ---------------------------------------------------------------------------
; Slim image: no TLS stack at all. See the header note for why this exists.
; ---------------------------------------------------------------------------
[env:ultra_slim]
extends = common
build_flags =
	${common.build_flags}
	-D NO_TLS

; ---------------------------------------------------------------------------
; Giveaway image: the slim build with the baked WiFi credential compiled out.
; A batch nobody keeps must not carry a venue network — thirty units that all
; try to join a WiFi the recipient does not have is thirty units that never
; open the setup AP their owner needs. -D NO_PROVISION makes that a build
; target instead of "remember to move a gitignored file first", which is not a
; safeguard (see the NO_PROVISION note in src/config.h). Identical to
; ultra_slim otherwise, so it fits the same stock OTA slot.
; ---------------------------------------------------------------------------
[env:ultra_giveaway]
extends = common
build_flags =
	${common.build_flags}
	-D NO_TLS
	-D NO_PROVISION

; ---------------------------------------------------------------------------
; Minimal OTA loader (src/loader.cpp): a tiny WiFi + web-OTA image, small enough
; to slip through a stock firmware whose updater rejects a larger one. Flash it
; over the stock OTA, then flash the real firmware over the loader's /update.
; build_src_filter compiles ONLY the loader.
; ---------------------------------------------------------------------------
[env:loader]
extends = common
extra_scripts =
build_flags =
	-D LOADER_BUILD
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_flags =
build_src_filter = -<*> +<loader.cpp>
lib_deps =
